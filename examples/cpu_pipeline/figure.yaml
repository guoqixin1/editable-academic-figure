  - {type: box, id: id, rect: [46, 22, 32, 22], title: ID, body: 译码/读寄存器}
  - {type: box, id: ex, rect: [84, 22, 32, 22], title: EX, body: 执行/ALU}
  - {type: box, id: mem, rect: [122, 22, 32, 22], title: MEM, body: 访存}
