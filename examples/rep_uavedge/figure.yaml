  - {type: asset, id: llama, rect: [182, 14, 12, 12], src: llama_head}
  - {type: tokens, id: vgrid, rect: [198, 16, 10, 3], n: 3, gap: 0.6, colors: ["#5E9ED0"]}
  - {type: tokens, id: vgrid2, rect: [198, 20, 10, 3], n: 3, gap: 0.6, colors: ["#9CC4E4"]}
  - {type: text, at: [188, 28.5], text: "LLaVA-7B", size: 7, bold: true, color: "#2B6CB0"}

