# 复现 goodcase 图2：UAV 边缘计算系统总览（无人机-基站-GPU 服务器 + 故障恢复流水线）
# 看点：弧线无线链路 + wifi/cross 标记 + 编号 badge 步骤条 + 图例框 + 云面板
figure: {width: 220, height: 128, dpi: 600, background: "#F7FAFD", assets_dir: ../_paper_assets}
theme: sci

assets:
  - {id: drone, prompt: 一架黑红色四旋翼无人机，扁平插画风格，斜上方视角, candidates: 3}
  - {id: server_building, prompt: 一栋深灰色现代数据中心小楼房，正面有多层服务器机架窗口，扁平插画风格，等轴视角, candidates: 3}
  - {id: llama_head, prompt: 一个可爱的白色羊驼头像图标，简洁线条，扁平插画风格, candidates: 2}
  - {id: city_block, prompt: 几栋蓝灰色城市高楼建筑群，扁平插画风格，等轴视角, candidates: 2}
  - {id: pine_tree, prompt: 两棵绿色松树和一小片草地，扁平插画风格, candidates: 2}

elements:
  # ── 左列：三架 UAV（场景卡在左，无人机在右）─────────────────
  - {type: badge, at: [7, 8], text: "1", size: 4.6, color: "#2B6CB0"}
  - {type: text, at: [11, 5.5], text: "UAV 1 (F450)", size: 7, bold: true, anchor: start}
  - {type: text, at: [11, 10], text: "Urban Logistics", size: 5.8, italic: true, color: "#52606D", anchor: start}
  - {type: box, id: chip1, rect: [3, 14, 15, 18], variant: plain, valign: top, title: " "}
  - {type: asset, id: city, rect: [4, 15.5, 13, 9], src: city_block}
  - {type: text, at: [10.5, 25.5], text: "Urban\nLogistics", size: 5.6, color: "#52606D"}
  - {type: asset, id: uav1, rect: [21, 13, 26, 19], src: drone}
  - {type: box, id: jn1, rect: [26, 33, 28, 6], title: "Jetson Nano 4GB", title_size: 5.6,
     fill: "#FFFFFF", stroke: "#2B6CB0"}

  - {type: badge, at: [7, 47], text: "2", size: 4.6, color: "#2B6CB0"}
  - {type: text, at: [11, 44.5], text: "UAV 2 (F450)", size: 7, bold: true, anchor: start}
  - {type: text, at: [11, 49], text: "Infrastructure Inspection", size: 5.8, italic: true, color: "#52606D", anchor: start}
  - {type: box, id: chip2, rect: [3, 53, 15, 19], variant: plain, valign: top, title: " "}
  - {type: asset, id: pylon, rect: [4, 54.5, 13, 10], src: power_tower}
  - {type: text, at: [10.5, 65.5], text: "Infrastructure\nInspection", size: 5.6, color: "#52606D"}
  - {type: asset, id: uav2, rect: [21, 52, 26, 19], src: drone}
  - {type: box, id: jn2, rect: [26, 72, 28, 6], title: "Jetson Nano 4GB", title_size: 5.6,
     fill: "#FFFFFF", stroke: "#2B6CB0"}

  - {type: badge, at: [7, 86], text: "3", size: 4.6, color: "#2E9E44"}
  - {type: text, at: [11, 83.5], text: "UAV 3 (F450)", size: 7, bold: true, anchor: start}
  - {type: text, at: [11, 88], text: "Environmental Monitoring", size: 5.8, italic: true, color: "#52606D", anchor: start}
  - {type: box, id: chip3, rect: [3, 92, 15, 18], variant: plain, valign: top, title: " "}
  - {type: asset, id: tree, rect: [4, 93.5, 13, 8.5], src: pine_tree}
  - {type: text, at: [10.5, 103], text: "Environmental\nMonitoring", size: 5.6, color: "#52606D"}
  - {type: asset, id: uav3, rect: [21, 91, 24, 17], src: drone}

  # ── 中部：基站 + GPU 服务器 ───────────────────────────────
  - {type: asset, id: bs, rect: [96, 18, 26, 46], src: cell_tower}
  - {type: asset, id: srv, rect: [118, 52, 40, 32], src: server_building}
  - {type: box, id: gpuchip, rect: [138, 60, 17, 9], fill: "#1A202C", stroke: "#2E9E44",
     title: "RTX 4070Ti\nGPU", title_size: 5.6, text_color: "#7BE38A"}
  - {type: text, at: [127, 87], text: "Base Station (Edge Server)", size: 7, bold: true}
  - {type: text, at: [127, 92], text: "RTX 4070Ti GPU Server", size: 6, color: "#52606D"}

