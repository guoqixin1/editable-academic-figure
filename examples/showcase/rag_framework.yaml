# A1 — RAG pipeline · neurips Soft Pastel
# 重制要点：加宽关键线缝给标签走廊；锚点避开 sketch 带；label_pos auto；精简窄缝标签
# 高度贴内容底；online 底 pad 加厚给 feedback 走廊，消原 ~15% 空白带
figure: {width: 180, height: 88, dpi: 600}
theme:
  preset: neurips

layout:
  kind: col
  gap: 6.0
  pad: [2.0, 2.5]
  align: stretch
  children:
    # ── Online ──
    - id: p_online
      type: panel
      kind: row
      # 主链 gap≥8mm：标签胶囊不蹭到端点 accent/sketch
      gap: 8.0
      # 底 pad 加厚：ans↔fuse feedback 标签走廊
      pad: [8.5, 2.5, 6.0, 2.5]
      align: center
      justify: start
      title: "Online Inference Pipeline"
      header_style: smallcaps
      fill: "#F7F7F5"
      title_size: 7.5
      header_h: 6.0
      children:
        # 等宽 16：同排中心距 = 16+7 = 23，消 uneven-gap
        - {ref: q, w: 16, h: 34}
        - {ref: rewrite, w: 16, h: 34}
        - kind: col
          gap: 2.5
          children:
            - {ref: dense, w: 16, h: 15.5}
            - {ref: sparse, w: 16, h: 15.5}
        - {ref: fuse, w: 16, h: 34}
        - {ref: compress, w: 16, h: 34}
        - {ref: llm, w: 16, h: 34}
        - kind: col
          gap: 2.5
          children:
            - {ref: verify, w: 16, h: 15.5}
            - {ref: ans, w: 16, h: 15.5}

    # ── Offline + legend ──
    - kind: row
      gap: 4.0
      align: start
      children:
        - id: p_offline
          type: panel
          kind: row
          gap: 7.0
          pad: [7.0, 3.5, 3.0, 3.5]
          align: center
          title: "Offline Index Build"
          header_style: smallcaps
          fill: "#F0F4F8"
          title_size: 7.5
          header_h: 5.5
          children:
            - {ref: docs, w: 22, h: 18}
            - {ref: chunk, w: 22, h: 18}
            - {ref: embed, w: 22, h: 18}
            - {ref: vdb, w: 22, h: 18}
        - kind: col
          gap: 2.5
          flex: 1
          align: stretch
          children:
            - {ref: fb_note, h: 11}
            - {ref: lg, h: 16}

elements:
  - {type: box, id: q, title: "User Query",
     body: "natural language", variant: plain, shape: stadium,
     sketch: waveform, valign: top, title_size: 6.8, body_size: 6.0}

  - {type: box, id: rewrite, title: "Query Rewrite",
     body: "HyDE + multi-q", variant: secondary, accent: left,
     sketch: tree, valign: top, title_size: 6.6, body_size: 6.0}

  - {type: box, id: dense, title: "Dense Retriever",
     body: "bi-encoder ANN", variant: primary, accent: left,
     sketch: scatter, valign: top, title_size: 6.4, body_size: 6.0}

  - {type: box, id: sparse, title: "Sparse BM25",
     body: "lexical match", variant: secondary,
     sketch: bars, valign: top, title_size: 6.4, body_size: 6.0}

  - {type: box, id: fuse, title: "Fusion + Rerank",
     body: "RRF + cross-enc", variant: primary, accent: left,
     sketch: heatmap, valign: top, title_size: 6.6, body_size: 6.0}

  - {type: box, id: compress, title: "Compress",
     body: "MMR + dedup", variant: vermillion,
     sketch: dots_flow, valign: top, title_size: 6.6, body_size: 6.0}

  - {type: box, id: llm, title: "LLM Generate",
     body: "token decode", variant: primary, accent: left,
     sketch: spectrum, valign: top, title_size: 6.6, body_size: 6.0}

  - {type: box, id: verify, title: "Cite+Verify",
     body: "NLI check", variant: tertiary,
     sketch: matrix, valign: top, title_size: 6.2, body_size: 6.0}

  - {type: box, id: ans, title: "Answer",
     body: "cited text", variant: purple, shape: stadium,
     sketch: nested, valign: top, title_size: 6.4, body_size: 6.0}

  # 主链：route avoid + auto 落标；侧向锚点压在 title 带（@t≲0.28）避开 sketch
  # raw q：auto 会上飘进面板标题；显式负 offset 压到箭头下方，gap=8 避开 accent
  - {type: arrow, from: q.right@0.22, to: rewrite.left@0.22, label: "raw q",
     weight: heavy, semantic: data, route: avoid, label_offset: -2.4}
  - {type: arrow, from: rewrite.right@0.15, to: dense.left@0.40,
     label: "768-d", weight: heavy, semantic: data, route: avoid, label_pos: auto}
  - {type: arrow, from: rewrite.right@0.30, to: sparse.left@0.40,
     label: "tok q", weight: heavy, semantic: data, route: avoid, label_pos: auto}
  - {type: arrow, from: dense.right@0.40, to: fuse.left@0.22,
     label: "k=50", weight: heavy, semantic: data, route: avoid, label_pos: auto}
  # sparse→fuse：底边切入；k 已在 dense 支路标明，此处省略避免挤进 sparse
  - {type: arrow, from: sparse.right@0.40, to: fuse.bottom@0.08,
     weight: heavy, semantic: data, route: avoid}
  - {type: arrow, from: fuse.right@0.22, to: compress.left@0.22,
     label: "k=8", weight: heavy, semantic: data, route: avoid, label_pos: auto}
  - {type: arrow, from: compress.right@0.22, to: llm.left@0.22,
     label: "≤4k", weight: heavy, semantic: data, route: avoid, label_pos: auto}
  - {type: arrow, from: llm.right@0.22, to: verify.left@0.40,
     label: "draft", weight: heavy, semantic: data, route: avoid, label_pos: auto}
  # verify/ans 底边 sketch 几乎满宽：锚到左右外侧条带
  - {type: arrow, from: verify.bottom@0.08, to: ans.top@0.08,
     label: "ok", weight: heavy, semantic: data, route: avoid, label_pos: auto}

  - {type: box, id: docs, title: "Doc Corpus",
     body: "PDF / wiki", variant: muted,
     sketch: grid, valign: top, title_size: 6.2, body_size: 6.0}

  - {type: box, id: chunk, title: "Chunking",
     body: "512+overlap", variant: muted,
     sketch: bars, valign: top, title_size: 6.2, body_size: 6.0}

  - {type: box, id: embed, title: "Embedding",
     body: "E5 / BGE", variant: sky, accent: left,
     sketch: scatter, valign: top, title_size: 6.2, body_size: 6.0}

  - {type: box, id: vdb, title: "Vector Store",
     body: "HNSW index", variant: primary, shape: cylinder,
     sketch: grid, valign: top, title_size: 6.2, body_size: 6.0}

  # offline：盒标题已含语义，链上不再挂标签（7mm 缝放不下 chunks/768-d）
  - {type: arrow, from: docs.right@0.28, to: chunk.left@0.28,
     weight: normal, semantic: optional, route: avoid}
  - {type: arrow, from: chunk.right@0.28, to: embed.left@0.28,
     weight: normal, semantic: optional, route: avoid}
  - {type: arrow, from: embed.right@0.28, to: vdb.left@0.28,
     weight: normal, semantic: optional, route: avoid}
  # rewrite 底边 tree 几乎满宽：锚到右侧外侧条带 @t≥0.95
  - {type: arrow, from: vdb.top@0.50, to: rewrite.bottom@0.96,
     label: "index", weight: thin, semantic: optional, route: avoid, label_pos: auto}
  # feedback：底边外侧锚点；收矮画布后走廊仍够放全称
  - {type: arrow, from: ans.bottom@0.92, to: fuse.bottom@0.92,
     label: "feedback", weight: thin, semantic: feedback, route: avoid, label_pos: auto}

  - {type: box, id: fb_note, title: "Feedback loop",
     body: "click / rating → reranker FT", variant: muted,
     title_size: 6.2, body_size: 6.0, sketch: curve, valign: top}

  - {type: legend, id: lg, style: inline, columns: 2, size: 5.8, items: [
      {swatch: box, color: "#0072B2", label: "neural / core"},
      {swatch: box, color: "#E69F00", label: "lexical / rewrite"},
      {swatch: box, color: "#56B4E9", label: "embedding"},
      {swatch: box, color: "#D55E00", label: "compress"},
      {swatch: box, color: "#009E73", label: "verify"},
      {swatch: box, color: "#CC79A7", label: "answer"},
      {swatch: dot, color: "#999999", label: "offline index"},
      {swatch: dashed, color: "#0072B2", label: "feedback"},
    ]}
