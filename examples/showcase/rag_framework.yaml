# A1 — RAG pipeline: flex layout tree + route: avoid（零手写坐标）
figure: {width: 180, height: 91, dpi: 600}
theme:
  preset: topconf

layout:
  kind: col
  gap: 7.0          # 两 panel 间隙：供 index 横走（勿穿 offline 标题）
  pad: [2.5, 3.0]
  align: stretch
  children:
    # ── Online ──
    - id: p_online
      type: panel
      kind: row
      gap: 3.0
      pad: [9.0, 3.5, 2.0, 3.5]   # 底 pad 收紧，使 rewrite.bottom  stub 落入间隙
      align: center
      justify: start
      title: "Online Inference Pipeline"
      header_style: smallcaps
      fill: "#F7F7F7"
      title_size: 7.0
      header_h: 6.5
      children:
        - {ref: q, w: 16, h: 36}
        # rewrite | 768(贴顶) | 检索 | top-k走廊 | fuse
        - kind: row
          gap: 1.5
          align: center
          children:
            - {ref: rewrite, w: 18, h: 36}
            # h=36 + align:start → 768 贴顶，下方竖走廊空出
            - kind: col
              gap: 0
              align: start
              w: 9
              h: 36
              children:
                - {ref: lbl_768, w: 9, h: 4.5}
            # 检索 | 宽走廊 | fuse：走廊供 top-k=50 胶囊贴线居中
            - kind: row
              gap: 14.0
              align: center
              children:
                - kind: col
                  gap: 3.0
                  children:
                    - {ref: dense, w: 18, h: 16.5}
                    - {ref: sparse, w: 18, h: 16.5}
                - {ref: fuse, w: 18, h: 36}
        - {ref: compress, w: 15, h: 36}
        - kind: row
          gap: 4.5
          align: center
          children:
            - {ref: llm, w: 19, h: 36}
            - kind: col
              gap: 3.0
              children:
                - {ref: verify, w: 16, h: 16.5}
                - {ref: ans, w: 16, h: 16.5}

    # ── Offline + legend ──
    - kind: row
      gap: 5
      align: start
      children:
        - id: p_offline
          type: panel
          kind: row
          gap: 4
          pad: [7.5, 4.0, 3.5, 4.0]
          align: center
          title: "Offline Index Build"
          header_style: smallcaps
          fill: "#F0F4F8"
          title_size: 7.0
          header_h: 6.0
          children:
            - {ref: docs, w: 20, h: 17}
            - {ref: chunk, w: 20, h: 17}
            - {ref: embed, w: 21, h: 17}
            - {ref: vdb, w: 25, h: 17}
        - kind: col
          gap: 2.5
          flex: 1
          align: stretch
          children:
            - {ref: fb_note, h: 10}
            - {ref: lg, h: 14}

elements:
  - {type: box, id: q, title: "User Query",
     body: "natural language", variant: plain, shape: stadium,
     sketch: waveform, valign: top, title_size: 6.8, body_size: 6.0}

  - {type: box, id: rewrite, title: "Query Rewrite",
     body: "HyDE + multi-q", variant: secondary, accent: left,
     sketch: tree, valign: top, title_size: 6.6, body_size: 6.0}

  - {type: text, id: lbl_768, text: "768-d vec", size: 6.0, color: "#4D4D4D",
     anchor: start}

  - {type: box, id: dense, title: "Dense Retriever",
     body: "bi-encoder ANN", variant: primary, accent: left,
     sketch: scatter, valign: top, title_size: 6.4, body_size: 6.0}

  - {type: box, id: sparse, title: "Sparse BM25",
     body: "lexical match", variant: secondary,
     sketch: bars, valign: top, title_size: 6.4, body_size: 6.0}

  - {type: box, id: fuse, title: "Fusion + Rerank",
     body: "RRF + cross-enc", variant: primary, accent: left,
     sketch: heatmap, valign: top, shadow: true, title_size: 6.6, body_size: 6.0}

  - {type: box, id: compress, title: "Compress",
     body: "MMR + dedup", variant: muted,
     sketch: dots_flow, valign: top, title_size: 6.6, body_size: 6.0}

  - {type: box, id: llm, title: "LLM Generate",
     body: "token decode", variant: primary, accent: left,
     sketch: spectrum, valign: top, shadow: true, title_size: 6.6, body_size: 6.0}

  - {type: box, id: verify, title: "Cite+Verify",
     body: "NLI check", variant: tertiary,
     sketch: matrix, valign: top, title_size: 6.2, body_size: 6.0}

  - {type: box, id: ans, title: "Answer",
     body: "cited text", variant: accent, shape: stadium,
     sketch: nested, valign: top, title_size: 6.4, body_size: 6.0}

  - {type: arrow, from: q.right, to: rewrite.left, label: "raw q", weight: heavy, route: avoid, label_offset: 1.4}
  - {type: arrow, from: rewrite.right@0.28, to: dense.left@0.61, weight: heavy, route: straight}
  - {type: arrow, from: rewrite.right@0.78, to: sparse.left, label: "tok q", weight: heavy, route: avoid, label_offset: -2.2}
  # top-k=50 胶囊贴 dense/sparse→fuse 走廊中段（走廊已加宽）
  - {type: arrow, from: dense.right, to: fuse.left@0.23, label: "top-k=50", weight: heavy, route: straight, label_offset: 0.0}
  - {type: arrow, from: sparse.right, to: fuse.left@0.77, label: "top-k=50", weight: heavy, route: straight, label_offset: 0.0}
  - {type: arrow, from: fuse.right, to: compress.left, label: "top-k=8", weight: heavy, route: avoid, label_offset: 2.2}
  - {type: arrow, from: compress.right, to: llm.left, label: "≤4k tok", weight: heavy, route: avoid, label_offset: 1.4}
  - {type: arrow, from: llm.right@0.23, to: verify.left, label: "draft", weight: heavy, route: avoid, label_offset: 1.4}
  - {type: arrow, from: verify.bottom, to: ans.top, label: "ok", weight: heavy, route: avoid, label_offset: 1.4}

  - {type: box, id: docs, title: "Doc Corpus",
     body: "PDF / wiki", variant: muted,
     sketch: grid, valign: top, title_size: 6.2, body_size: 6.0}

  - {type: box, id: chunk, title: "Chunking",
     body: "512+overlap", variant: muted,
     sketch: bars, valign: top, title_size: 6.2, body_size: 6.0}

  - {type: box, id: embed, title: "Embedding",
     body: "E5 / BGE", variant: secondary, accent: left,
     sketch: scatter, valign: top, title_size: 6.2, body_size: 6.0}

  - {type: box, id: vdb, title: "Vector Store",
     body: "HNSW index", variant: primary, shape: cylinder,
     sketch: grid, valign: top, title_size: 6.2, body_size: 6.0}

  - {type: arrow, from: docs.right, to: chunk.left, label: "docs", style: dashed, weight: normal, route: avoid, label_offset: 1.4}
  - {type: arrow, from: chunk.right, to: embed.left, label: "chunks", style: dashed, weight: normal, route: avoid, label_offset: 1.4}
  - {type: arrow, from: embed.right, to: vdb.left, label: "768-d", style: dashed, weight: normal, route: avoid, label_offset: 1.4}
  # index：vdb 上竖段 → 两 panel 间隙横段 → rewrite 底边（检索区左侧），不穿 offline 标题
  - {type: arrow, from: vdb.top, to: rewrite.bottom@1.0,
     style: dashed, weight: thin, label: "index", route: avoid, label_offset: 1.4}
  - {type: arrow, from: ans.bottom, to: fuse.bottom,
     style: dotted, weight: thin, label: "feedback", route: avoid, label_offset: 1.4}

  - {type: box, id: fb_note, title: "Feedback loop",
     body: "click / rating → reranker FT", variant: muted,
     title_size: 6.2, body_size: 6.0, sketch: curve, valign: top}

  - {type: legend, id: lg, columns: 2, size: 6.0, items: [
      {swatch: box, color: "#0072B2", label: "neural / core"},
      {swatch: box, color: "#E69F00", label: "lexical / rewrite"},
      {swatch: box, color: "#009E73", label: "verify / answer"},
      {swatch: dashed, color: "#4D4D4D", label: "offline index"},
      {swatch: dot, color: "#4D4D4D", label: "feedback (dotted)"},
    ]}
