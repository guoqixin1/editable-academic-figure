# A2 — Multi-branch vision backbone + multi-task heads
figure: {width: 180, height: 94, dpi: 600}
theme:
  preset: topconf
  palette:
    primary: "#00897B"
    secondary: "#FFB300"
    section_bg: "#ECEFF1"

elements:
  # -- Macro --
  - {type: panel, id: p_macro, rect: [3, 2.5, 102, 88.5], title: "Overall Architecture",
     header_style: smallcaps, fill: "#ECEFF1", title_size: 7.0, header_h: 6.5}

  - {type: box, id: img, rect: [9, 12, 18, 24], title: "Input Image",
     body: "RGB H×W", variant: plain, shape: parallelogram,
     sketch: grid, valign: top, title_size: 6.6, body_size: 6.0}

  - {type: box, id: patch, rect: [9, 42, 18, 24], title: "Patch Embed",
     body: "16×16 tokens", variant: secondary, accent: left,
     sketch: grid, valign: top, title_size: 6.6, body_size: 6.0}

  # corridors: patch.right=27 -> grp.left=43 (16mm); grp.right=65 -> fpn.left=79 (14mm)
  - {type: group, id: vit_grp, rect: [43, 12, 22, 54], fill: "#FFFFFF", style: dashed,
     color: "#00897B", lw: 0.45, label: "×N", label_pos: inside-top, label_size: 7.5}

  - {type: box, id: vit, rect: [44.5, 20, 19, 42], title: "Transformer",
     body: "MHSA+FFN", variant: primary, accent: left,
     sketch: heatmap, valign: top, shadow: true, title_size: 6.4, body_size: 6.0}

  - {type: box, id: fpn, rect: [79, 12, 22, 15], title: "Feat. Pyramid",
     body: "P3–P5", variant: primary, accent: left,
     sketch: bars, valign: top, shadow: true, title_size: 6.2, body_size: 6.0}

  # equal 4mm gaps; no body -> sketch taller; bars/grid/heatmap distinct
  - {type: box, id: h_cls, rect: [79, 31, 22, 15], title: "Cls · GAP→FC",
     variant: secondary, sketch: bars, valign: top, title_size: 6.2}

  - {type: box, id: h_det, rect: [79, 50, 22, 15], title: "Det · box+cls",
     variant: secondary, sketch: grid, valign: top, title_size: 6.2}

  - {type: box, id: h_seg, rect: [79, 69, 22, 15], title: "Seg · mask",
     variant: secondary, sketch: heatmap, valign: top, title_size: 6.2}

  - {type: arrow, from: img.bottom, to: patch.top, label: "B×3×H×W", weight: heavy,
     label_bg: true}
  - {type: arrow, from: patch.right, to: vit.left@0.70, weight: heavy}
  # vertical mid-corridor, clear of patch.right(27) and grp.left(43)
  - {type: text, id: dim1, at: [34, 55], text: "196×768", size: 6.0, color: "#333333",
     anchor: middle, rotate: -90}
  - {type: arrow, from: vit.right, to: fpn.left, weight: heavy, route: hv}
  - {type: text, id: dim2, at: [70, 15.2], text: "B×L×D", size: 6.0, color: "#333333",
     anchor: middle}
  - {type: arrow, from: fpn.bottom, to: h_cls.top, label: "P3–P5", weight: normal,
     label_bg: true}
  - {type: arrow, from: fpn.bottom, to: h_det.left, route: hv, weight: normal}
  - {type: arrow, from: fpn.bottom, to: h_seg.left, route: hv, weight: normal}

  # skip: no arrow label; rotated text mid-left only
  - {type: arrow, from: patch.left, to: fpn.top,
     via: [[6.8, 54], [6.8, 11.0], [90, 11.0]], style: dashed, weight: thin}
  - {type: text, id: skip_lbl, at: [6.8, 42], text: "skip", size: 6.0, color: "#666666",
     anchor: middle, rotate: -90}

  # -- Micro --
  - {type: panel, id: p_micro, rect: [109, 2.5, 68, 88.5], title: "Transformer Block (detail)",
     header_style: smallcaps, fill: "#F7F7F7", title_size: 7.0, header_h: 6.5}

  - {type: box, id: x_in, rect: [116, 12, 54, 10], title: "X_{in}",
     body: "R^{B×L×D} · L=196 · D=768", variant: plain, title_size: 6.6, body_size: 6.0}

  - {type: box, id: ln1, rect: [116, 24.5, 20, 12], title: "LayerNorm",
     body: "pre-norm", variant: muted, title_size: 6.2, body_size: 6.0}

  - {type: box, id: mhsa, rect: [140, 24.5, 30, 20], title: "MHSA",
     body: "h=12 heads", variant: secondary, accent: left,
     sketch: heatmap, valign: top, shadow: true, title_size: 6.8, body_size: 6.0}

  - {type: box, id: add1, rect: [116, 48, 54, 10], title: "Add & Norm",
     body: "X + MHSA(X)", variant: tertiary, title_size: 6.4, body_size: 6.0}

  - {type: box, id: ln2, rect: [116, 61, 20, 12], title: "LayerNorm",
     body: "pre-norm", variant: muted, title_size: 6.2, body_size: 6.0}

  - {type: box, id: ffn, rect: [140, 61, 30, 14], title: "FFN",
     body: "GELU · 4D", variant: primary, accent: left,
     sketch: bars, valign: top, shadow: true, title_size: 6.8, body_size: 6.0}

  - {type: box, id: add2, rect: [116, 78, 54, 10], title: "Add & Norm",
     body: "Y + FFN(Y) → X_{out}", variant: tertiary, title_size: 6.4, body_size: 6.0}

  - {type: arrow, from: x_in.bottom, to: ln1.top, weight: heavy}
  - {type: arrow, from: ln1.right, to: mhsa.left, label: "Q,K,V", weight: heavy,
     label_bg: true}
  - {type: arrow, from: mhsa.bottom, to: add1.top@0.78, weight: heavy}
  - {type: arrow, from: x_in.left, to: add1.left,
     via: [[112, 17], [112, 53]], style: dashed, weight: thin, label: "res",
     label_bg: true}
  - {type: arrow, from: add1.bottom, to: ln2.top, weight: heavy}
  - {type: arrow, from: ln2.right, to: ffn.left, label: "B×L×D", weight: heavy,
     label_bg: true, label_offset: 2.2}
  - {type: arrow, from: ffn.bottom, to: add2.top@0.78, weight: heavy}
  - {type: arrow, from: add1.left, to: add2.left,
     via: [[112, 53], [112, 83]], style: dashed, weight: thin, label: "res",
     label_bg: true}

  # callout in corridor x=72; end y = 2.5 + 0.95*88.5 = 86.575
  - {type: arrow, from: vit.right@0.92, to: p_micro.left@0.95,
     via: [[72, 62], [72, 86.6], [106.5, 86.6]], style: dashed, weight: thin,
     label: "block detail", color: "#00897B", label_bg: true, label_offset: -2.2}

  - {type: legend, id: lg, at: [9, 70], columns: 1, size: 6.0, items: [
      {swatch: box, color: "#00897B", label: "backbone"},
      {swatch: box, color: "#FFB300", label: "attn / heads"},
      {swatch: dashed, color: "#4D4D4D", label: "residual / skip"},
    ]}
