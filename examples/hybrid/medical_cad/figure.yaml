# Medical imaging CAD pipeline · hybrid v6.3 (lineart + journal-schematic)
# v6.3：删画布内大标题；压底部条带；feedback 走模块-卡片走廊；箭头落浅缝；metrics 边框统一
# 主管线幽灵盒仅标题（无 body），避免贴片下探压住底稿插画
# 底图不动（base/base.png）
figure: {width: 236, dpi: 600}
theme:
  preset: lineart

base:
  image: base/base.png
  mode: skeleton
  style: journal-schematic
  candidates: 4
  accent: [seg, clf]
  prompt: |
    Restyle ONLY the saturated colored blocks in the reference skeleton into a
    publication-ready medical imaging CAD pipeline schematic (Nature Methods /
    journal-schematic austerity). Orthographic grid layout overall; instruments
    may use a restrained equipment-catalog three-quarter view — never a toy
    isometric town.

    CRITICAL TITLE RESERVE (must obey for every upper-row module):
    - The TOP 30% of each module plate is a TEXT LANDING ZONE: plain flat seamless
      near-white / very-light-gray fill (luma ≥ 220), ZERO icons, ZERO glyphs,
      ZERO decoration, ZERO outlines, ZERO second plates. Illustration ink MUST
      occupy ONLY the lower ~70% of each plate.
    - Leave a clear EMPTY margin along EVERY plate edge: bottom ~20–24% of plate
      height (connector attach zone — no stands, no bezels, no glyphs), left/right
      ≥14% inset so side connectors land on empty margin only.
    - Keep ALL ink STRICTLY INSIDE each colored skeleton footprint — do not spill
      into white gutters between plates (prevents region drift).
    - Especially PACS (rightmost): monitor stand and bezel stay well above the
      bottom empty margin; screen content inset from left/right edges ≥14%.
    - Diagnosis / Preprocess monitors: keep bezels inset; never let screen corners
      enter the top 30% title band; bottom 22% empty of stand.
    - Report form: keep top-left corner of the plate empty light fill for title;
      left edge ≥14% empty for logits connector.
    - Pale gray (#EEEEEE) blocks in middle/lower rows are reserved — keep them
      plain flat very-light-gray, do NOT illustrate.

    Upper row ONLY — seven footprint plates left to right. Each plate = LIGHT
    NEUTRAL panel (near-white / cool grey, luma > 210) with at most a thin
    categorical accent strip (left edge hairline, ≤6% of plate width). Sharp or
    barely-rounded rectangles; hairline dark strokes. Icons STRICTLY INSIDE the
    lower 70% footprint, never outside, never into gutters or title band.

    Middle-band icons only (technical glyphs, not cute props), fully inset:
    - Acquisition: catalog-style laboratory microscope + compact slide scanner
      (accurate silhouettes — NOT rounded toy scopes); keep scanner body clear
      of left/right edges so FOV connector lands on empty margin
    - Preprocess: orthographic device monitor with dual waveform / denoise curves
      only; bezel fully inside plate; top 30% empty
    - Segmentation: layered U-Net tile stack + contour anatomical section
      (NOT soft candy organ); stack sits in lower 70%, top clear for title
    - Feature extract: small-multiples morphometric contour glyphs + embedding
      grid of dots (NOT yellow blobs / sticker cells); glyphs in lower 70%
    - Diagnosis: orthographic desk monitor with abstract scan marks; fully inside
      plate; top 30% empty; bottom margin clear of stand
    - Report: structured report / form grid (ruled rows, empty checkbox squares as
      geometric glyphs ONLY) — NO clipboard, NO pen; top-left corner of plate
      stays empty light fill for title
    - PACS review: wide orthographic monitor with schematic torso cross-section;
      stand clear of bottom margin; top 30% empty light fill

    Do NOT draw anything in the middle row, lower I/O row, or bottom legend band.

    Color discipline: muted editorial accents only as thin taxonomy cues; large
    fields stay neutral gray/white. Forbidden: macaron full-card fills, candy
    colors, thick comic outlines, sticker drop shadows, glossy bevels.

    No arrows/connectors between plates. No arrowheads, no flow lines, no chevrons.
    Absolutely no text: no letters, digits, words, captions, watermarks, logos.
    White / near-white canvas; no outer page frame.

elements:
  # 主管线：幽灵 → 底稿插画；仅标题（body 下探会压画）
  - {type: box, id: mic, title: "Acquisition",
     variant: muted, valign: top, title_size: 6.0}
  - {type: box, id: prep, title: "Preprocess",
     variant: muted, valign: top, title_size: 6.0}
  - {type: box, id: seg, title: "Segmentation",
     variant: primary, accent: left, valign: top, title_size: 6.0}
  - {type: box, id: feat, title: "Feature Extract",
     variant: secondary, accent: left, valign: top, title_size: 5.8}
  - {type: box, id: clf, title: "Diagnosis",
     variant: primary, accent: left, valign: top, title_size: 6.0}
  - {type: box, id: report, title: "Report",
     variant: muted, valign: top, title_size: 6.0}
  - {type: box, id: doctor, title: "PACS review",
     variant: secondary, valign: top, title_size: 5.8}

  # 临床栏 / I/O：实体矢量面板 — 短 token 填实；卡高贴文字（内容占比≥55%）；valign middle 减底空
  - {type: box, id: findings, title: "Findings",
     body: "mass · edema · WMH · atrophy · calcif",
     variant: muted, valign: middle, title_size: 5.8, body_size: 5.5, ghost: false}
  - {type: box, id: out_note, title: "Structured Output",
     body: "C71.9 · G93.1 · I63.9 · confidence",
     variant: muted, valign: middle, title_size: 5.8, body_size: 5.5, ghost: false}
  - {type: box, id: metrics, title: "QA Metrics",
     body: "Dice · AUC · ECE · calib.",
     variant: muted, valign: middle, title_size: 5.8, body_size: 5.5, ghost: false}

  - {type: box, id: io_acq, title: "In/Out · Acq",
     body: "DICOM · FOV · H×W×C · meta",
     variant: muted, valign: middle, title_size: 5.5, body_size: 5.5, ghost: false}
  - {type: box, id: io_seg, title: "In/Out · Seg",
     body: "N4 · resample · z-norm · crop",
     variant: secondary, valign: middle, title_size: 5.5, body_size: 5.5, ghost: false}
  - {type: box, id: io_feat, title: "In/Out · Feat",
     body: "morph · texture · CNN emb",
     variant: secondary, valign: middle, title_size: 5.5, body_size: 5.5, ghost: false}
  - {type: box, id: io_dx, title: "In/Out · Dx",
     body: "C71.9 · G93.1 · I63.9 · logits",
     variant: muted, valign: middle, title_size: 5.5, body_size: 5.5, ghost: false}

  # 底栏：灰阶+钢蓝图例；trainable 靠火焰角标传达（无孤立 loop 浮带）
  - {type: legend, id: lg, columns: 3, size: 5.6, style: inline, items: [
      {swatch: box, color: "#3D6B99", label: "trainable stage"},
      {swatch: box, color: "#4A5568", label: "pipeline / I/O"},
      {swatch: dashed, color: "#2F5A85", label: "clinician feedback"},
    ]}

  # badges / fire：按 resolve 模块顶边重锚（模块行 y=4）
  - {type: badge, id: bd1, at: [6.4, 4.6], text: "1", size: 2.8, color: "#4A5568"}
  - {type: badge, id: bd2, at: [38.4, 4.6], text: "2", size: 2.8, color: "#4A5568"}
  - {type: badge, id: bd3, at: [72.9, 4.6], text: "3", size: 2.8, color: "#3D6B99"}
  - {type: badge, id: bd4, at: [110.2, 4.6], text: "4", size: 2.8, color: "#4A5568"}
  - {type: badge, id: bd5, at: [144.7, 4.6], text: "5", size: 2.8, color: "#3D6B99"}
  - {type: badge, id: bd6, at: [179.3, 4.6], text: "6", size: 2.6, color: "#4A5568"}
  - {type: marker, id: m_fire_seg, at: [94.7, 6.5], icon: fire, size: 2.6, color: "#3D6B99"}
  - {type: marker, id: m_fire_clf, at: [163.8, 6.5], icon: fire, size: 2.6, color: "#3D6B99"}

  # 主管线 6 箭：PIL 量底图白缝外缘 @ y=14；终点=实画左边-clear，起点=实画右边+clear
  # FOV 标签改独立 text（箭缝窄，arrow label 会压 ghost mic）
  - {type: text, id: lab_fov, at: [30.6, 15.7], text: "FOV", size: 5.5, anchor: middle,
     color: "#2A2E35", plate: false}
  - {type: arrow, from: [29.15, 14.0], to: [32.05, 14.0],
     weight: heavy, semantic: data, route: straight}
  - {type: arrow, from: [67.55, 14.0], to: [68.1, 14.0],
     weight: thin, semantic: data, route: straight}
  - {type: arrow, from: [105.5, 14.0], to: [108.35, 14.0],
     weight: heavy, semantic: data, route: straight}
  - {type: arrow, from: [139.05, 14.0], to: [142.9, 14.0], label: "R^d",
     weight: heavy, semantic: data, route: straight, label_offset: 2.8}
  - {type: arrow, from: [172.25, 14.0], to: [173.55, 14.0], label: "logits",
     weight: heavy, semantic: data, route: straight, label_offset: 2.8}
  - {type: arrow, from: [206.05, 14.0], to: [208.15, 14.0],
     weight: normal, semantic: data, route: straight}

  # PACS→QA：PACS 下边框左角 → metrics 顶
  - {type: arrow, from: [208.46, 28.0], to: metrics.top@0.90,
     weight: thin, semantic: data, route: vh}
  # Findings→Structured Output（卡中线 y=34.5+4.5）
  - {type: arrow, from: [79.80, 39.0], to: [82.10, 39.0],
     weight: normal, semantic: data, route: straight}
  # clinician feedback：Diagnosis 实画下边=30.55；尖=31.35；水平段在 clf 下走廊
  # label_offset 负值=向模块侧；贴片须落在 (30.95, 34.10) 走廊带
  - {type: arrow, from: [168.0, 34.35], to: [148.8, 31.35],
     via: [[168.0, 32.6], [148.8, 32.6]],
     weight: thin, semantic: feedback,
     label: "clinician feedback", label_offset: -0.35}


layout:
  kind: col
  gap: 0
  pad: [1.5, 2.0, 0.6, 2.0]
  align: stretch
  children:
    # 无画布内大标题：正式标题放 caption；模块行上移
    - id: p_pipe
      type: panel
      kind: col
      gap: 6.5
      pad: [2.5, 2.4, 0.4, 2.4]
      align: stretch
      fill: "#F7F8FA"
      children:
        - kind: row
          gap: 7.0
          align: stretch
          children:
            - {ref: mic, flex: 0.95, h: 24}
            - {ref: prep, flex: 1.05, h: 24}
            - {ref: seg, flex: 1.15, h: 24}
            - {ref: feat, flex: 1.05, h: 24}
            - {ref: clf, flex: 1.05, h: 24}
            - {ref: report, flex: 0.9, h: 24}
            - {ref: doctor, flex: 0.9, h: 24}

        # 左缩进 2.5mm；卡高压缩；图例紧贴；无 loop 浮带
        - kind: col
          gap: 1.4
          pad: [0, 0, 0, 2.5]
          align: stretch
          children:
            - kind: row
              gap: 3.0
              align: stretch
              children:
                - {ref: findings, flex: 1, h: 9.0}
                - {ref: out_note, flex: 1, h: 9.0}
                - {ref: metrics, flex: 1, h: 9.0}

            - kind: row
              gap: 2.5
              align: stretch
              children:
                - {ref: io_acq, flex: 1, h: 8.5}
                - {ref: io_seg, flex: 1, h: 8.5}
                - {ref: io_feat, flex: 1, h: 8.5}
                - {ref: io_dx, flex: 1, h: 8.5}

            - kind: row
              gap: 0
              align: stretch
              children:
                - {ref: lg, flex: 1, h: 4.8}
