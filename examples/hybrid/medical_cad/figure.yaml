# C2 — Medical imaging CAD pipeline · hybrid v5 (journal-schematic)
# v5：base.style=journal-schematic；场景按 style-anchors REPORT §4.1 去科普插画感
# 保留 v4 几何：pad.top 11.5 / feedback clf.bottom@0.78 / 同色头带零外扩
figure: {width: 236, dpi: 600}
theme:
  preset: neurips

base:
  image: base/base.png
  image: base/base.png
  image: base/base.png
  image: base/base.png
  image: base/base.png
  image: base/base.png
  image: base/base.png
  image: base/base.png
  image: base/base.png
  mode: skeleton
  style: journal-schematic
  candidates: 3
  image: base/base.png
  prompt: |
    Restyle ONLY the saturated colored blocks in the reference skeleton into a
    publication-ready medical imaging CAD pipeline schematic (Nature Methods methods-figure
    austerity). Orthographic grid layout overall; instruments may use a restrained
    equipment-catalog three-quarter view — never a toy isometric town.

    Inside each module, the lighter same-hue header band is a text-plate reserve — keep it
    plain flat seamless same-hue fill (no icons, no decoration, no separate white/gray
    rectangle, no outline, no second plate). Do not redraw the header band as a distinct
    card. Pale gray (#EEEEEE) blocks elsewhere are reserved areas — keep them plain flat
    very-light-gray, do NOT illustrate, decorate, or recolor them.

    Upper row ONLY — seven footprint plates left to right. Each plate becomes a LIGHT
    NEUTRAL panel (near-white / cool grey / warm beige, luma > 210) with at most a thin
    categorical accent strip or corner tick (left edge or top hairline, ≤8% of plate width);
    DO NOT flood the whole card with macaron pastel. Sharp or barely-rounded rectangles;
    hairline dark strokes. Draw icons STRICTLY INSIDE the plate footprint, never outside,
    never overlapping neighboring gutters. Keep positions fixed. Leave the TOP third of
    each plate nearly empty (title landing; match the light tinted header band). Leave a
    clear EMPTY margin along the BOTTOM edge (~18–22% of plate height) so connectors attach
    without piercing icons. Especially for the rightmost PACS monitor: keep the stand well
    above the plate bottom.

    Middle-band icons only (technical glyphs, not cute props); keep EVERY glyph inset
    ≥12% from left/right plate edges and ≥10% from bottom empty margin (prevents ink
    spilling into white gutters — critical for preprocess / diagnosis / PACS monitors):
    - Acquisition: catalog-style laboratory microscope + compact slide scanner on a bench
      (accurate silhouettes, technical-manual detail hierarchy — NOT rounded toy scopes)
    - Preprocess: orthographic rectangular device monitor showing schematic dual waveform /
      denoise curves only (not cute UI chrome); monitor bezel fully inside plate
    - Segmentation: layered U-Net tile stack + low-detail technical anatomical organ schematic
      as contour/section line drawing (NOT soft candy/gummy organ blob, NOT 3D soft organ)
    - Feature extract: small-multiples morphometric contour glyphs + embedding/feature grid
      of dots (NOT yellow soft blobs, NOT sticker cells, NOT kidney candy shapes)
    - Diagnosis: orthographic desk monitor with schematic medical-scan marks on screen
      (abstract scan silhouette / intensity map — not playful UI); fully inside plate
    - Report: structured report panel / form grid (ruled rows, empty checkbox squares as
      geometric glyphs ONLY) — NO clipboard, NO pen, NO cute office props
    - PACS review: wide orthographic monitor with schematic torso cross-section scan;
      stand clear of bottom margin; fully inside plate

    Do NOT draw anything in the middle row, lower I/O row, or bottom legend band — those
    pale-gray reserved blocks stay empty flat gray.

    Color discipline: muted editorial accents only as thin taxonomy cues; large fields stay
    neutral. Forbidden: macaron full-card fills, candy colors, thick comic outlines, sticker
    drop shadows, glossy bevels. Catalog shading on instruments only (subtle). Same
    illustrator across plates. White gutters between plates untouched.

    No arrows/connectors between plates. No arrowheads, no flow lines, no chevrons.
    Absolutely no text: no letters, digits, words, captions, watermarks, logos, or
    placeholder phrases. Do NOT label stages under icons (no "Acquisition"/"Report"/
    "U-Net"/glyph names). No math symbols as readable characters. Pure pictures only.
    White / near-white canvas; no outer page frame.

elements:
  # 主管线：幽灵 → 底稿插画；矢量只叠标题/箭头
  - {type: box, id: mic, title: "Acquisition",
     variant: muted, valign: top, title_size: 6.0}
  - {type: box, id: prep, title: "Preprocess",
     body: "denoise + norm", variant: muted,
     valign: top, title_size: 6.0, body_size: 5.6}
  - {type: box, id: seg, title: "Segmentation",
     body: "U-Net / SAM", variant: trainable, accent: left,
     valign: top, title_size: 6.0, body_size: 5.6}
  - {type: box, id: feat, title: "Feature Extract",
     body: "morph + CNN emb", variant: secondary, accent: left,
     valign: top, title_size: 5.8, body_size: 5.6}
  - {type: box, id: clf, title: "Diagnosis",
     body: "multi-label head", variant: trainable, accent: left,
     valign: top, title_size: 6.0, body_size: 5.6}
  - {type: box, id: report, title: "report",
     variant: tertiary, valign: top, title_size: 6.0}
  - {type: box, id: doctor, title: "PACS review",
     variant: sky, valign: top, title_size: 5.8}

  # 临床栏 / I/O：实体矢量面板
  - {type: box, id: findings, title: "Findings",
     body: "ROI descriptors", variant: tertiary, sketch: bars, valign: top,
     title_size: 5.8, body_size: 5.6, ghost: false}
  - {type: box, id: out_note, title: "Structured Output",
     body: "ICD + confidence", variant: tertiary, sketch: matrix, valign: top,
     title_size: 5.8, body_size: 5.6, ghost: false}
  - {type: box, id: metrics, title: "QA Metrics",
     body: "Dice · AUC · ECE", variant: sky, sketch: distribution, valign: top,
     title_size: 5.8, body_size: 5.6, ghost: false}

  - {type: box, id: io_acq, title: "In/Out · Acq  ·  raw→H×W×C",
     variant: muted, sketch: spectrum,
     valign: top, title_size: 5.6, ghost: false}
  - {type: box, id: io_seg, title: "In/Out · Seg  ·  tensor→mask+ROI",
     variant: primary, sketch: heatmap,
     valign: top, title_size: 5.6, ghost: false}
  - {type: box, id: io_feat, title: "In/Out · Feat  ·  ROI→R^d",
     variant: secondary, sketch: scatter,
     valign: top, title_size: 5.6, ghost: false}
  - {type: box, id: io_dx, title: "In/Out · Dx  ·  emb→logits/ICD",
     variant: trainable, sketch: bars,
     valign: top, title_size: 5.6, ghost: false}

  # 底栏：legend 横排 + 右侧闭环说明卡（消右半空置）
  - {type: legend, id: lg, columns: 4, size: 5.6, style: inline, items: [
      {swatch: box, color: "#E07A3D", label: "neural / trainable"},
      {swatch: box, color: "#E69F00", label: "feature stage"},
      {swatch: box, color: "#DDDDDD", label: "preprocess"},
      {swatch: dashed, color: "#0072B2", label: "clinician feedback"},
    ]}
  - {type: box, id: loop_note, title: "Closed loop · PACS → QA · Dx feedback",
     variant: sky, ghost: false, valign: middle,
     title_size: 5.6}

  # badges / fire：随 pad.top +2mm 整体下移（贴各盒左上 / 右上内侧）
  - {type: badge, id: bd1, at: [6.4, 13.6], text: "1", size: 2.8, color: "#0072B2"}
  - {type: badge, id: bd2, at: [38.4, 13.6], text: "2", size: 2.8, color: "#666666"}
  - {type: badge, id: bd3, at: [72.9, 13.6], text: "3", size: 2.8, color: "#E07A3D"}
  - {type: badge, id: bd4, at: [110.2, 13.6], text: "4", size: 2.8, color: "#E69F00"}
  - {type: badge, id: bd5, at: [144.7, 13.6], text: "5", size: 2.8, color: "#E07A3D"}
  - {type: badge, id: bd6, at: [179.3, 13.6], text: "6", size: 2.6, color: "#009E73"}
  - {type: marker, id: m_fire_seg, at: [94.5, 16.2], icon: fire, size: 2.6}
  - {type: marker, id: m_fire_clf, at: [164.2, 16.2], icon: fire, size: 2.6}

  # 顶行：统一 t=0.48 → 水平直线；标签落缝隙
  - {type: arrow, from: mic.right@0.48, to: prep.left@0.48, label: "FOV",
     weight: heavy, semantic: data, route: straight, label_pos: auto}
  - {type: arrow, from: prep.right@0.48, to: seg.left@0.48,
     weight: heavy, semantic: data, route: straight}
  - {type: arrow, from: seg.right@0.48, to: feat.left@0.48,
     weight: heavy, semantic: data, route: straight}
  - {type: arrow, from: feat.right@0.48, to: clf.left@0.48, label: "R^d",
     weight: heavy, semantic: data, route: straight, label_pos: auto}
  - {type: arrow, from: clf.right@0.48, to: report.left@0.48, label: "logits",
     weight: heavy, semantic: data, route: straight, label_pos: auto}
  - {type: arrow, from: report.right@0.48, to: doctor.left@0.48,
     weight: normal, semantic: data, route: straight}

  - {type: arrow, from: doctor.bottom@0.23, to: metrics.top@0.75,
     weight: thin, semantic: data, route: straight}
  - {type: arrow, from: findings.right@0.40, to: out_note.left@0.40,
     weight: normal, semantic: data, route: straight}
  - {type: arrow, from: out_note.top@0.88, to: clf.bottom@0.78,
     weight: thin, semantic: feedback, route: avoid}

layout:
  kind: col
  gap: 0
  pad: [1.5, 2.0, 0.6, 2.0]
  align: stretch
  children:
    - id: p_pipe
      type: panel
      kind: col
      gap: 7.0
      pad: [11.5, 2.4, 1.0, 2.4]
      align: stretch
      title: "Medical Imaging CAD Pipeline"
      header_style: smallcaps
      fill: "#F0F4F8"
      title_size: 6.6
      header_h: 5.0
      children:
        - kind: row
          gap: 7.0
          align: stretch
          children:
            - {ref: mic, flex: 0.95, h: 22}
            - {ref: prep, flex: 1.05, h: 22}
            - {ref: seg, flex: 1.15, h: 22}
            - {ref: feat, flex: 1.05, h: 22}
            - {ref: clf, flex: 1.05, h: 22}
            - {ref: report, flex: 0.9, h: 22}
            - {ref: doctor, flex: 0.9, h: 22}

        - kind: row
          gap: 5.0
          align: stretch
          children:
            - {ref: findings, flex: 1, h: 14}
            - {ref: out_note, flex: 1, h: 14}
            - {ref: metrics, flex: 1, h: 14}

        - kind: row
          gap: 2.0
          align: stretch
          children:
            - {ref: io_acq, flex: 1, h: 12}
            - {ref: io_seg, flex: 1, h: 12}
            - {ref: io_feat, flex: 1, h: 12}
            - {ref: io_dx, flex: 1, h: 12}

        - kind: row
          gap: 3.0
          align: stretch
          children:
            - {ref: lg, flex: 1.35, h: 7.5}
            - {ref: loop_note, flex: 1.0, h: 7.5}
