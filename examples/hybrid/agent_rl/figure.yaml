# B1 — LLM Agent RL Training Loop · technical-lineart · 混合模式 v5.1（灰阶纪律）
# 风格：REPORT §4.2 + base.style technical-lineart；骨架灰阶+钢蓝关键路径；小盒 ghost:false
figure: {width: 184, dpi: 600, background: "#FFFFFF"}
theme:
  preset: neurips
  plate_pad: 2.0
  plate_opacity: 0.92
  plate_radius: 0.0

base:
  image: base/base.png
  mode: skeleton
  style: technical-lineart
  accent: [policy, upd]
  candidates: 3
  image: base/base.png
  prompt: >
    Orthographic technical-lineart schematic of an LLM agent RL training loop
    as a conference systems/ML architecture figure (OSDI/SOSP + ResNet/Transformer
    block-diagram austerity). GREYSCALE structure with sparse light hatching /
    nested module fills. Skeleton reference uses cool greys for all modules
    EXCEPT the steel-blue-tinted critical-path blocks (Agent Policy + GRPO/PPO
    update) — those TWO blocks alone may keep a muted steel-blue wash; every
    other module must stay near-greyscale (no orange, no teal, no categorical
    poster colors). Sharp or barely-rounded rectangles (near right angles).
    Hairline dark strokes. White ground. High information density.
    NO mascots, NO smiley robots, NO sticker outlines, NO macaron pastel panels,
    NO parchment scrolls, NO balance scales, NO trophy medals, NO snowflake emoji.

    CRITICAL — ZERO TEXT: draw ZERO text of any kind — no panel titles, captions,
    words, letters, digits, Greek letters, code glyphs, JSON tags. Geometry and
    hatching only. Do not echo prompt words onto the canvas.

    CRITICAL — NO ARROWS / NO CONNECTORS: do NOT draw arrows, arrowheads, chevrons,
    directional triangles, flow ribbons, connecting lines, leader lines, or any
    directional symbols between or inside modules. Vector layer adds connectors.

    FOOTPRINT LOCK (STRICT): every illustrated prop stays strictly inside its
    skeleton block; no spill into gutters. Keep ≥3mm empty margin inside
    each block edge. Shrink nested stacks to fit with clear breathing room.

    RESERVED HEADBANDS (CRITICAL): Each module block has a lighter same-family
    headband strip at the top (greyscale blocks → lighter grey wash; steel-blue
    critical-path blocks → lighter blue-grey wash). Headbands are reserved for
    later vector text — keep them plain flat wash only. Do NOT paint icons,
    hatching stacks, dials, or decorations on the headband. Place each module's
    engineering content ONLY in the denser portion BELOW the light headband.

    ICON PLACEMENT (CRITICAL): Put the full nested structure inside the denser
    portion under the headband so stacks/slots/cylinders are complete, not
    cropped. Leave ≥2mm margin from block edges. Do not invade the headband.

    Pale-gray reserved blocks (skeleton #EEEEEE) stay plain — do not illustrate
    them (vector solids will cover). Describe modules by POSITION only.

    LEFT cool pale panel (Environment & Agent) — illustrate ONLY these blocks:
    - Top parallelogram block: nested task-dispatcher stack — thin orthogonal
      rectangles like a schema / control plane (ticket cards as flat rect slots,
      tiny tree as geometric lines). GREYSCALE only. NO clipboard cute props.
    - Large center block (STEEL-BLUE critical path): Agent Policy as an ABSTRACT
      neural block stack — stacked Transformer/ResNet-like rectangles with light
      hatching and one nested inner block (decoder stack metaphor). May use the
      muted steel-blue wash from the skeleton; NOT orange, NOT a face.
      FORBIDDEN: robot head, smiley, eyes, cheeks, anthropomorphic chip-brain
      mascot. Absolutely no captions, callouts, or annotation strings anywhere.
    - Bottom row of three small blocks are pale-gray reserved — leave plain
      (Search / Code / Memory are vector solids). Do NOT draw filing cabinets,
      drawers, or cute office props anywhere.

    UPPER-MIDDLE warm-neutral panel (Trajectory Sampling):
    - Left greyscale block: rollout ARRAY — a tight grid / row of step cells or
      parallel undirected trajectory strips (token-step matrix), greyscale only
      (vary value/hatching, not hue). FORBIDDEN: parchment scroll, paper roll,
      ribbon tips, arrowheads, saturated cell colors.
    - Right of that block: calm empty light strip for later vector tokens —
      leave blank (no tiles/cubes/letter blocks).

    UPPER-RIGHT pale panel (Advantage & Update):
    - Top greyscale block: group-relative advantage as comparison BAR MODULE /
      meter bars (no numerals) — full bars visible under headband. Technical
      chart glyph, not a toy dial sticker. Greyscale only.
    - Bottom block (STEEL-BLUE critical path): policy-update / GRPO module as
      nested residual-style block stack with light hatching (optional tiny
      geometric triangle pulse — not a letter, NOT an arrow). May keep muted
      steel-blue wash. Prefer stacked gradient-update blocks over cartoon gears;
      if gears appear they must be flat patent-drawing gears, not sticker toys.

    LOWER-MIDDLE mint-neutral panel (Reward Model):
    - Left tall greyscale block: reward SCORING HEAD — scalar score module with
      simple vertical/horizontal bars or a compact bar panel. GREYSCALE only —
      no orange/amber fill. FORBIDDEN: balance scale, trophy, award ribbon, medal.
    - Three small pale-gray reserved blocks (Success / −λT / Format) — leave
      plain; vector solids will cover. Do NOT draw medallions, batteries,
      hourglasses, clipboards, or check stickers there.

    LOWER-RIGHT near-white panel (Side Path):
    - Single tall greyscale block: upper half = minimal engineering database
      cylinder (stacked disks) OR pure stacked buffer rectangles; lower half =
      frozen reference policy as a hatched nested block stack in cool pale grey
      (distinct hatching from the steel-blue trainable policy stack) — NO ice
      crystal, NO snowflake emoji, NO mascot replica face, NO second accent hue.

    BOTTOM strip:
    - Left wide pale reserved block: leave completely blank / plain light wash
      (vector equation card). Far right: blank (legend / note space).

    Style reminder: greyscale everywhere except the two steel-blue critical-path
    modules (Policy + GRPO/PPO); hairline strokes; near-right-angle corners;
    nested stacks and light hatching; plain headbands; no arrows; no text.

layout:
  kind: col
  gap: 1.6
  pad: [3.2, 3.2, 1.6, 3.2]
  align: stretch
  children:
    - kind: row
      gap: 4.0
      align: stretch
      children:
        - id: p_env
          type: panel
          kind: col
          gap: 2.0
          pad: [5.6, 2.2, 1.8, 2.2]
          align: stretch
          title: "Environment & Agent"
          header_style: smallcaps
          fill: "#F4F6F8"
          title_size: 6.4
          header_h: 5.0
          w: 46
          children:
            - {ref: env, h: 12.5}
            - {ref: policy, h: 18}
            - kind: row
              gap: 1.2
              pad: [3.1, 0, 0, 0]
              children:
                # h=19 与 rm/side 对齐，并盖住底稿外溢 KV 槽（不改底稿像素）
                - {ref: tool_s, h: 19, flex: 1}
                - {ref: tool_c, h: 19, flex: 1}
                - {ref: tool_m, h: 19, flex: 1}

        - kind: col
          gap: 2.4
          flex: 1
          align: stretch
          children:
            - kind: row
              gap: 4.0
              align: stretch
              children:
                - id: p_roll
                  type: panel
                  kind: row
                  gap: 1.6
                  pad: [5.6, 2.0, 1.6, 2.0]
                  align: center
                  title: "Trajectory Sampling"
                  header_style: smallcaps
                  fill: "#F7F7F5"
                  title_size: 6.4
                  header_h: 5.0
                  flex: 1.2
                  children:
                    - {ref: roll, w: 34, h: 22}
                    - kind: col
                      gap: 0.7
                      flex: 1
                      align: stretch
                      children:
                        - {ref: tok_traj, h: 6.8}
                        - {ref: t_tok, h: 3.0}
                        - {ref: tok_tool, h: 6.8}
                        - {ref: t_g, h: 3.0}
                - id: p_upd
                  type: panel
                  kind: col
                  gap: 4.0
                  pad: [5.6, 2.2, 1.6, 2.2]
                  align: stretch
                  title: "Advantage & Update"
                  header_style: smallcaps
                  fill: "#F5F5F7"
                  title_size: 6.4
                  header_h: 5.0
                  w: 48
                  children:
                    - {ref: adv, h: 12.5}
                    - {ref: upd, h: 11.5}

            - kind: row
              gap: 4.0
              align: stretch
              children:
                - id: p_rew
                  type: panel
                  kind: row
                  gap: 1.5
                  pad: [5.6, 2.0, 1.6, 2.0]
                  align: center
                  title: "Reward Model"
                  header_style: smallcaps
                  fill: "#F4F7F5"
                  title_size: 6.4
                  header_h: 5.0
                  flex: 1.2
                  children:
                    - {ref: rm, w: 20, h: 19}
                    - kind: col
                      gap: 1.2
                      flex: 1
                      align: stretch
                      children:
                        - kind: row
                          gap: 1.2
                          children:
                            - {ref: r_succ, h: 9.0, flex: 1}
                            - {ref: r_step, h: 9.0, flex: 1}
                        - {ref: r_fmt, h: 9.0}
                - id: p_aux
                  type: panel
                  kind: col
                  gap: 0.4
                  pad: [5.6, 2.0, 1.6, 2.0]
                  align: stretch
                  title: "Side Path"
                  header_style: smallcaps
                  fill: "#F6F6F5"
                  title_size: 6.4
                  header_h: 5.0
                  w: 48
                  children:
                    - {ref: side, h: 19}

    - kind: row
      gap: 2.0
      align: stretch
      children:
        - {ref: loss_box, flex: 1.0, h: 12}
        - {ref: lg, flex: 1.0, h: 12}
        - {ref: note_box, w: 48, h: 12}

elements:
  # 底稿工程物件：policy / roll / side / rm / adv / upd / env / tool_m（幽灵）
  - {type: box, id: env, title: "Task Dispatcher",
     body: "prompt · schema · tools", variant: secondary, shape: parallelogram,
     valign: top, title_size: 6.0, body_size: 5.6}
  - {type: box, id: policy, title: "Agent Policy π_θ",
     body: "LLM decoder + tool API", variant: trainable, accent: left,
     valign: top, title_size: 6.2, body_size: 5.6}
  - {type: box, id: roll, title: "G Rollouts",
     body: "multi-turn tools", variant: primary, accent: left,
     valign: top, title_size: 6.0, body_size: 5.6}
  - {type: box, id: rm, title: "Reward Model",
     body: "r(τ) composite", variant: secondary, accent: left,
     valign: top, title_size: 6.0, body_size: 5.6}

  # Search/Code：纯灰阶小图标易与矢量盒无异 → 实体矢量
  - {type: box, id: tool_s, title: "Search",
     body: "web/RAG", variant: sky, valign: top, ghost: false,
     title_size: 5.6, body_size: 5.6}
  - {type: box, id: tool_c, title: "Code",
     body: "sandbox", variant: purple, valign: top, ghost: false,
     title_size: 5.6, body_size: 5.6}
  # Memory：本卡 KV 槽溢出难包住 → 与 Search/Code 同走实体矢量
  - {type: box, id: tool_m, title: "Memory",
     body: "KV R/W", variant: tertiary, valign: top, ghost: false,
     title_size: 5.6, body_size: 5.6}

  - {type: tokens, id: tok_traj, n: 7, direction: h, variant: primary, gap: 0.4,
     colors: ["#D6EAF8", "#AED6F1", "#D6EAF8", "#85C1E9", "#D6EAF8", "#AED6F1", "#D6EAF8"]}
  - {type: tokens, id: tok_tool, n: 6, direction: h, variant: secondary, gap: 0.45,
     colors: ["#F7EDEA", "#EEDDD8", "#F0F0F0", "#E6D0CA", "#F0F0F0", "#F7EDEA"]}
  - {type: text, id: t_tok, text: "tau · tool-call tokens", size: 5.6,
     color: "#0072B2", anchor: start}
  - {type: text, id: t_g, text: "G∥ · T steps", size: 5.6,
     color: "#0072B2", anchor: start}

  # 奖励小盒：底稿易退化成空灰块 → 实体矢量
  - {type: box, id: r_succ, title: "Success",
     body: "task hit", variant: tertiary, valign: top, ghost: false,
     title_size: 5.6, body_size: 5.6}
  - {type: box, id: r_step, title: "−λT",
     body: "steps", variant: muted, valign: top, ghost: false,
     title_size: 5.6, body_size: 5.6}
  - {type: box, id: r_fmt, title: "Format Check",
     body: "schema / JSON", variant: accent, valign: top, ghost: false,
     title_size: 5.6, body_size: 5.6}

  - {type: box, id: adv, title: "Advantage Ahat",
     body: "group-relative", variant: primary, accent: left,
     valign: top, title_size: 6.0, body_size: 5.6}
  - {type: box, id: upd, title: "GRPO / PPO",
     body: "policy gradient Δθ", variant: trainable, accent: left,
     valign: top, title_size: 6.0, body_size: 5.6}

  - {type: box, id: side, title: "Replay Buffer · π_ref",
     body: "store τ · batch · β·KL region (frozen)", variant: accent,
     valign: top, title_size: 5.8, body_size: 5.6}

  - {type: box, id: loss_box, title: "Training objective",
     body: "L = −Ahat log π_θ − β KL(π_θ ‖ π_ref)\n↑ expected return · stay inside β·KL trust region",
     variant: sky, ghost: false, valign: middle, align: left,
     title_size: 5.8, body_size: 5.6}
  - {type: legend, id: lg, columns: 3, size: 5.6, style: inline,
     items: [
       {swatch: dashed, color: "#0072B2", label: "Δθ feedback"},
       {swatch: dashed, color: "#999999", label: "KL / replay"},
       {swatch: line, color: "#333333", label: "main loop"},
     ]}
  - {type: box, id: note_box, title: "Line styles",
     body: "solid = data/control\ndashed = aux path",
     variant: muted, ghost: false, valign: middle, align: left,
     title_size: 5.6, body_size: 5.6}

  - {type: badge, id: b1, at: [7.0, 11.5], text: "1", size: 3.0, color: "#D55E00"}
  - {type: badge, id: b2, at: [7.0, 26.0], text: "2", size: 3.0, color: "#E07A3D"}
  - {type: badge, id: b3, at: [55.0, 15.0], text: "3", size: 3.0, color: "#0072B2"}
  - {type: badge, id: b4, at: [55.0, 48.0], text: "4", size: 3.0, color: "#D55E00"}
  - {type: badge, id: b5, at: [132.0, 11.5], text: "5", size: 3.0, color: "#009E73"}
  - {type: marker, id: m_fire1, at: [44.5, 26.0], icon: fire, size: 2.6}
  - {type: marker, id: m_fire2, at: [174.0, 28.5], icon: fire, size: 2.6}
  - {type: marker, id: m_snow, at: [174.0, 62.0], icon: snow, size: 2.4}

  - {type: arrow, from: env.bottom@1.0, to: policy.top@1.0, label: "task",
     weight: heavy, semantic: data, route: avoid, label_pos: auto}
  - {type: arrow, from: tool_s.top@0.72, to: policy.bottom@0.22,
     weight: thin, semantic: control, label: "api", route: avoid, label_pos: auto,
     label_offset: 2.2}
  - {type: arrow, from: tool_c.top@0.5, to: policy.bottom@1.0,
     weight: thin, semantic: control, route: avoid}
  - {type: arrow, from: tool_m.top@0.5, to: policy.bottom@0.97,
     weight: thin, semantic: control, route: avoid}
  - {type: arrow, from: policy.right@0.15, to: roll.left@0.18,
     weight: heavy, semantic: data, route: avoid}
  - {type: arrow, from: roll.bottom@0.18, to: rm.top@0.18,
     weight: heavy, semantic: data, route: avoid}
  - {type: arrow, from: r_step.right@0.28, to: adv.left@0.28, label: "r",
     weight: heavy, semantic: data, route: avoid, label_pos: auto}
  - {type: arrow, from: adv.bottom@0.0, to: upd.top@0.0, label: "Â",
     weight: heavy, semantic: data, route: avoid, label_pos: auto}

  - {type: arrow, from: upd.left@0.45, to: policy.right@0.45, label: "Δθ",
     weight: heavy, semantic: feedback, route: avoid, label_pos: auto}

  - {type: arrow, from: tok_tool.right@0.5, to: side.left@0.25,
     weight: thin, semantic: optional, route: avoid}
  - {type: arrow, from: side.top@0.15, to: upd.bottom@0.0, label: "batch",
     weight: thin, semantic: optional, route: avoid, label_pos: auto}
  - {type: arrow, from: side.left@0.75, to: upd.left@0.85,
     weight: thin, semantic: optional, route: avoid}
