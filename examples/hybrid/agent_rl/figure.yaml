  - {type: arrow, from: env.bottom@0.72, to: policy.top@0.72, label: "task",
     weight: heavy, semantic: data, route: straight, label_offset: 2.0}
  # badge-3：Policy → Rollout 水平直连（对齐 y≈31.5）
  - {type: arrow, from: policy.right@0.265, to: roll.left@0.822,
     weight: heavy, semantic: data, route: straight}
  # badge-5：Rollout 网格 → Advantage 水平直连（对齐 y≈11.2；题字在箭头下方）
  - {type: arrow, from: roll.right@0.077, to: adv.left@0.138,
     weight: heavy, semantic: data, route: straight}
  # Sampling → Reward Head
  - {type: arrow, from: roll.bottom@0.18, to: rm.top@0.40,
     weight: heavy, semantic: data, route: vh}
  # r 回报：走走廊；竖段 x=130.5；r 胶囊偏右落走廊净空
