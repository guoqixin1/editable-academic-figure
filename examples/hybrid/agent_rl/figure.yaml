     weight: heavy, semantic: data, color: "#2A2E35", route: vh,
     via: [[130.5, 54.95], [130.5, 20.0]], label_offset: 2.0}
  # Â：竖直短箭；杆从 Advantage 下缘内侧起，尖停在 GRPO 顶外 ~0.5mm
  - {type: arrow, from: [173.0, 23.20], to: [173.0, 26.76], label: "Â",
     weight: normal, semantic: data, route: straight, label_offset: 3.0}
  # Δθ：右缘→上缘走廊→Policy（画布顶缘仅留此虚线）
  - {type: arrow, from: upd.right@0.20, to: policy.right@0.08, label: "Δθ",
     weight: heavy, semantic: feedback, route: vh,
     via: [[182.0, 29.8], [182.0, 1.8], [48.0, 1.8], [48.0, 26.9]],
     label_pos: auto}

  # 工具箭：尖端落在 Policy 下缘外 ~1.3mm（policy.bottom=49.66 → 51.00）
  - {type: arrow, from: tool_s.top@0.50, to: [11.9, 51.00],
     weight: thin, semantic: control, route: straight}
  - {type: arrow, from: tool_c.top@0.50, to: [26.2, 51.00],
     weight: thin, semantic: control, route: straight}
  - {type: arrow, from: tool_m.top@0.50, to: [40.6, 51.00],
     weight: thin, semantic: control, route: straight}

  # batch：点线 Side → GRPO；标签在竖段右侧
  - {type: arrow, from: side.top@0.12, to: upd.bottom@0.12, label: "batch",
     weight: thin, semantic: optional, route: straight, label_offset: 3.2}
