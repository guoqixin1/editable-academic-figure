# B1 — LLM Agent RL Training Loop · neurips Soft Pastel · 混合模式试点
# AI 整图底稿 + 矢量标注层；layout/文字/箭头/图例语义与纯矢量版对齐
figure: {width: 184, dpi: 600, background: "#FFFFFF"}
theme:
  preset: neurips

base:
  mode: skeleton
  candidates: 3
  image: base/base.png
  prompt: >
    Flat vector scientific illustration of an LLM agent reinforcement-learning
    training loop as a hero diagram. Soft NeurIPS pastel fills ONLY — every
    module must be light pastel (mint, peach, lavender, sky, cream, soft blue).
    Unified thin dark stroke, white/near-white background, generous gaps.

    CRITICAL COLOR DISCIPLINE: NO dark fills, NO black/charcoal/navy panels,
    NO deep brown parchment, NO saturated hot-pink slabs. The parchment-scroll
    rollout module MUST stay light cream / soft peach pastel — never ink-black
    or dark brown. All icons use pale washes with thin strokes only.

    CRITICAL: draw ZERO text of any kind — no panel titles, no captions, no
    words under icons, no letters, no digits, no Greek letters, no code glyphs
    like angle-brackets or curly braces, no JSON tags. Icons only. Do not echo
    any words from this prompt onto the canvas.

    FOOTPRINT LOCK: every illustration prop must stay strictly inside its
    colored skeleton block; do not spill ink into neighboring gaps or panels.
    Keep a thin light margin inside each block edge.

    Module props must match each colored skeleton block (one prop family per
    block; do not merge blocks). Describe by POSITION/COLOR only. Pale-gray
    reserved blocks stay plain empty — do not illustrate them.

    LEFT cool-blue wash panel:
    - Top parallelogram block: control-tower clipboard with branching ticket
      cards and a tiny schema-tree glyph (icon strokes only).
    - Large center block: friendly chip-brain robot head with a glowing neural
      chip faceplate (warm soft-orange accent on pale fill).
    - Bottom row of three small blocks left-to-right:
      magnifying glass over a tiny web globe;
      terminal-window icon with abstract code-line bars (NO letter glyphs);
      filing drawer / stacked memory chips.

    UPPER-MIDDLE warm-peach wash panel:
    - Left colored block: LIGHT pastel parchment scroll (cream/peach only,
      never dark) with 3–4 soft forking trajectory ribbons in soft blue/coral.
    - Right of that block: calm empty light strip (do NOT draw tiles, cubes,
      grids, or letter blocks there — leave blank for later vector tokens).

    UPPER-RIGHT lavender wash panel:
    - Top block: comparison dial / pastel rising bars (no numerals on dial).
    - Bottom block: interlocking gears with a soft triangular energy pulse
      (geometric triangle only, not a letter).

    LOWER-MIDDLE mint wash panel:
    - Left tall block: balance scale or trophy scoreboard with soft bars.
    - Two small top blocks: green check medallion; hourglass / shrinking meter.
    - Bottom wide small block (Format Check): tiny checklist clipboard ONLY —
      scale the icon down so it fits entirely inside the block with clear
      inner padding; blank tick boxes only (no letter tags); do not overflow.

    LOWER-RIGHT neutral-gray wash panel:
    - Top block: database cylinder barrel with stacked disks (pastel).
    - Bottom block: icy crystal replica of the policy robot — frosted pale
      blue glass with snowflake accents (frozen copy, distinct from the warm
      trainable robot).

    BOTTOM strip:
    - Left wide pale-gray reserved block: leave completely blank / plain
      light-gray (vector equation card will cover it) — no pink plaque,
      no chalkboard, no waveform.
    - Far right outside that block: keep blank (legend space).

    Style: flat pastel scientific hero illustration, soft fills, consistent
    2px stroke, no photorealism, no neon, no dark modules. No arrows or
    connecting lines between modules; clear gaps; label landing zones stay
    light and plain.

layout:
  kind: col
  gap: 1.6
  pad: [4.5, 3.2, 1.6, 3.2]
  align: stretch
  children:
    - kind: row
      # 加宽 panel 缝：给 act / r(τ) 标签走廊
      gap: 4.0
      align: stretch
      children:
        - id: p_env
          type: panel
          kind: col
          gap: 2.0
          pad: [5.6, 2.2, 1.8, 2.2]
          align: stretch
          title: "Environment & Agent"
          header_style: smallcaps
          fill: "#E8F4FD"
          title_size: 6.4
          header_h: 5.0
          w: 46
          children:
            - {ref: env, h: 12.5}
            - {ref: policy, h: 18}
            - kind: row
              gap: 1.2
              # 与右栏 Reward/Side 顶缘对齐（消 row-misaligned 0.6mm）
              pad: [4.6, 0, 0, 0]
              children:
                - {ref: tool_s, h: 13, flex: 1}
                - {ref: tool_c, h: 13, flex: 1}
                - {ref: tool_m, h: 13, flex: 1}

        - kind: col
          gap: 2.4
          flex: 1
          align: stretch
          children:
            - kind: row
              gap: 4.0
              align: stretch
              children:
                - id: p_roll
                  type: panel
                  kind: row
                  gap: 1.6
                  pad: [5.6, 2.0, 1.6, 2.0]
                  align: center
                  title: "Trajectory Sampling"
                  header_style: smallcaps
                  fill: "#FFF3E0"
                  title_size: 6.4
                  header_h: 5.0
                  flex: 1.2
                  children:
                    - {ref: roll, w: 22, h: 18}
                    - kind: col
                      gap: 0.7
                      flex: 1
                      align: stretch
                      children:
                        - {ref: tok_traj, h: 6.8}
                        - {ref: t_tok, h: 3.0}
                        - {ref: tok_tool, h: 6.8}
                        - {ref: t_g, h: 3.0}
                - id: p_upd
                  type: panel
                  kind: col
                  # Ahat 标签走廊：adv↔upd ≥5mm
                  gap: 5.0
                  pad: [5.6, 2.2, 1.6, 2.2]
                  align: stretch
                  title: "Advantage & Update"
                  header_style: smallcaps
                  fill: "#F3E5F5"
                  title_size: 6.4
                  header_h: 5.0
                  w: 48
                  children:
                    - {ref: adv, h: 11.5}
                    - {ref: upd, h: 10.5}

            - kind: row
              gap: 4.0
              align: stretch
              children:
                - id: p_rew
                  type: panel
                  kind: row
                  gap: 1.5
                  pad: [5.6, 2.0, 1.6, 2.0]
                  align: center
                  title: "Reward Model"
                  header_style: smallcaps
                  fill: "#E6F5F0"
                  title_size: 6.4
                  header_h: 5.0
                  flex: 1.2
                  children:
                    - {ref: rm, w: 20, h: 19}
                    - kind: col
                      gap: 1.2
                      flex: 1
                      align: stretch
                      children:
                        - kind: row
                          gap: 1.2
                          children:
                            - {ref: r_succ, h: 9.0, flex: 1}
                            - {ref: r_step, h: 9.0, flex: 1}
                        - {ref: r_fmt, h: 9.0}
                - id: p_aux
                  type: panel
                  kind: col
                  gap: 1.6
                  pad: [8.0, 2.2, 1.6, 2.2]
                  align: stretch
                  title: "Side Path"
                  header_style: smallcaps
                  fill: "#F7F7F5"
                  title_size: 6.4
                  header_h: 5.0
                  w: 48
                  children:
                    - {ref: buf, h: 10.5}
                    - {ref: ref, h: 9.5}

    # 底栏充实左下：目标卡 + legend
    - kind: row
      gap: 2.2
      align: stretch
      children:
        - {ref: loss_box, flex: 1.15, h: 12}
        - {ref: lg, flex: 1.0, h: 12}

elements:
  # 具象模块 → 幽灵盒，形象由底稿承担；保留 title/body 给矢量叠字
  - {type: box, id: env, title: "Task Dispatcher",
     body: "prompt · schema · tools", variant: secondary, shape: parallelogram,
     valign: top, title_size: 6.0, body_size: 5.6}
  - {type: box, id: policy, title: "Agent Policy π_θ",
     body: "LLM decoder + tool API", variant: trainable, accent: left,
     valign: top, title_size: 6.2, body_size: 5.6}
  - {type: box, id: tool_s, title: "Search",
     body: "web/RAG", variant: sky, valign: top,
     title_size: 5.6, body_size: 5.6}
  - {type: box, id: tool_c, title: "Code",
     body: "sandbox", variant: purple, valign: top,
     title_size: 5.6, body_size: 5.6}
  - {type: box, id: tool_m, title: "Memory",
     body: "KV R/W", variant: tertiary, valign: top,
     title_size: 5.6, body_size: 5.6}

  - {type: box, id: roll, title: "G Rollouts",
     body: "multi-turn tools", variant: primary, accent: left,
     valign: top, title_size: 6.0, body_size: 5.6}
  # token 网格为纯符号 → 保留矢量实体绘制
  - {type: tokens, id: tok_traj, n: 7, direction: h, variant: primary, gap: 0.4}
  - {type: tokens, id: tok_tool, n: 6, direction: h, variant: secondary, gap: 0.45,
     colors: ["#FCE8E6", "#FCE8E6", "#F0F0F0", "#FCE8E6", "#F0F0F0", "#FCE8E6"]}
  - {type: text, id: t_tok, text: "tau · tool-call tokens", size: 5.6,
     color: "#0072B2", anchor: start}
  - {type: text, id: t_g, text: "G∥ · T steps", size: 5.6,
     color: "#0072B2", anchor: start}

  - {type: box, id: rm, title: "Reward Model",
     body: "r(τ) composite", variant: secondary, accent: left,
     valign: top, title_size: 6.0, body_size: 5.6}
  - {type: box, id: r_succ, title: "Success",
     body: "task hit", variant: tertiary, valign: top,
     title_size: 5.6, body_size: 5.6}
  - {type: box, id: r_step, title: "−λT",
     body: "steps", variant: muted, valign: top,
     title_size: 5.6, body_size: 5.6}
  - {type: box, id: r_fmt, title: "Format Check",
     body: "schema / JSON", variant: accent, valign: top,
     title_size: 5.6, body_size: 5.6}

  - {type: box, id: adv, title: "Advantage Ahat",
     body: "group-relative", variant: primary, accent: left,
     valign: top, title_size: 6.0, body_size: 5.6}
  - {type: box, id: upd, title: "GRPO / PPO",
     body: "policy gradient Δθ", variant: trainable, accent: left,
     valign: top, title_size: 6.0, body_size: 5.6}

  - {type: box, id: buf, title: "Replay Buffer",
     body: "store τ · batch", variant: accent, shape: cylinder,
     title_size: 5.8, body_size: 5.6}
  - {type: box, id: ref, title: "π_ref (frozen)",
     body: "β·KL region", variant: frozen, valign: top,
     title_size: 5.6, body_size: 5.6}

  # 实体矢量盒：避免幽灵底栏被生图模型画成饱和粉色平板
  - {type: box, id: loss_box, title: "Training objective",
     body: "L = −Ahat log π_θ − β KL(π_θ ‖ π_ref)", variant: sky,
     ghost: false, valign: top, title_size: 5.8, body_size: 5.6}
  # 幽灵插画下色块图例失真；只保留仍成立的线型语义
  - {type: legend, id: lg, columns: 2, size: 5.6, style: inline,
     items: [
       {swatch: dashed, color: "#0072B2", label: "Δθ feedback"},
       {swatch: dashed, color: "#999999", label: "KL / replay (optional)"},
     ]}

  - {type: badge, id: b1, at: [7.0, 11.5], text: "1", size: 3.0, color: "#D55E00"}
  - {type: badge, id: b2, at: [7.0, 26.0], text: "2", size: 3.0, color: "#E07A3D"}
  - {type: badge, id: b3, at: [55.0, 15.0], text: "3", size: 3.0, color: "#0072B2"}
  - {type: badge, id: b4, at: [55.0, 48.0], text: "4", size: 3.0, color: "#D55E00"}
  - {type: badge, id: b5, at: [132.0, 11.5], text: "5", size: 3.0, color: "#009E73"}
  - {type: marker, id: m_fire1, at: [44.5, 26.0], icon: fire, size: 2.6}
  - {type: marker, id: m_fire2, at: [174.0, 28.5], icon: fire, size: 2.6}
  - {type: marker, id: m_snow, at: [174.0, 62.0], icon: snow, size: 2.4}

  - {type: arrow, from: env.bottom@1.0, to: policy.top@1.0, label: "task",
     weight: heavy, semantic: data, route: avoid, label_pos: auto}
  # 工具↑政策：左右边衬出口；中卡走向右边衬，避免集体左绕
  - {type: arrow, from: tool_s.top@0.5, to: policy.bottom@0.0,
     weight: thin, semantic: control, label: "api", route: avoid, label_pos: auto}
  - {type: arrow, from: tool_c.top@0.5, to: policy.bottom@1.0,
     weight: thin, semantic: control, route: avoid}
  - {type: arrow, from: tool_m.top@0.5, to: policy.bottom@0.97,
     weight: thin, semantic: control, route: avoid}
  # act/store 语义已清，省略标签；短词给窄缝
  - {type: arrow, from: policy.right@0.15, to: roll.left@0.18,
     weight: heavy, semantic: data, route: avoid}
  # τ 标签缝被 token/文案占满，语义由面板标题承担
  - {type: arrow, from: roll.bottom@1.0, to: rm.top@1.0,
     weight: heavy, semantic: data, route: avoid}
  - {type: arrow, from: r_step.right@0.28, to: adv.left@0.28, label: "r",
     weight: heavy, semantic: data, route: avoid, label_pos: auto}
  - {type: arrow, from: adv.bottom@0.0, to: upd.top@0.0, label: "Â",
     weight: heavy, semantic: data, route: avoid, label_pos: auto}

  # Δθ：略下移锚点，减轻 base 模式障碍集下的 awkward 绕行
  - {type: arrow, from: upd.left@0.45, to: policy.right@0.45, label: "Δθ",
     weight: heavy, semantic: feedback, route: avoid, label_pos: auto}

  - {type: arrow, from: tok_tool.right@0.5, to: buf.left@0.2,
     weight: thin, semantic: optional, route: avoid}
  - {type: arrow, from: buf.top@0.12, to: upd.bottom@0.0, label: "batch",
     weight: thin, semantic: optional, route: avoid, label_pos: auto}
  - {type: arrow, from: ref.left@0.25, to: upd.left@0.85, label: "KL",
     weight: thin, semantic: optional, route: avoid, label_pos: auto}
