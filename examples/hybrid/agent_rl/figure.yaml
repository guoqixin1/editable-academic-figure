# B1 — LLM Agent RL Training Loop · lineart + technical-lineart · 混合模式
# 矢量层按底图像素色块实测对齐（ghost + 裸文字；实心卡仅进空槽）
# 换算: base 1584×672 → canvas 184×86 mm（preserveAspectRatio=none）
figure: {width: 184, height: 86, dpi: 600, background: "#FFFFFF"}
theme:
  preset: lineart
  plate_pad: 0.55
  plate_opacity: 0.92
  plate_radius: 0.45

base:
  image: base/base.png
  mode: skeleton
  style: technical-lineart
  accent: [policy, upd]
  candidates: 4
  prompt: >
    Orthographic technical-lineart schematic of an LLM agent RL training loop
    as a conference systems/ML architecture figure (OSDI/SOSP + ResNet/Transformer
    block-diagram austerity). GREYSCALE structure with sparse light hatching /
    nested module fills. Skeleton reference uses cool greys for all modules
    EXCEPT the steel-blue-tinted critical-path blocks (Agent Policy + GRPO/PPO
    update) — those TWO blocks alone may keep a muted steel-blue wash; every
    other module must stay near-greyscale (no orange, no teal, no categorical
    poster colors). Sharp or barely-rounded rectangles (near right angles).
    Hairline dark strokes. White ground. High information density.
    NO mascots, NO smiley robots, NO sticker outlines, NO macaron pastel panels,
    NO parchment scrolls, NO balance scales, NO trophy medals, NO snowflake emoji.

    CRITICAL — ZERO TEXT: draw ZERO text of any kind — no panel titles, captions,
    words, letters, digits, Greek letters, code glyphs, JSON tags. Geometry and
    hatching only. Do not echo prompt words onto the canvas.

    CRITICAL — NO ARROWS / NO CONNECTORS: do NOT draw arrows, arrowheads, chevrons,
    directional triangles, flow ribbons, connecting lines, leader lines, or any
    directional symbols between or inside modules. Vector layer adds connectors.

    FOOTPRINT LOCK (STRICT): every illustrated prop stays strictly inside its
    skeleton block; no spill into gutters. Keep ≥3mm empty margin inside
    each block edge. Shrink nested stacks to fit with clear breathing room.

    RESERVED TITLE BANDS (CRITICAL — MUST OBEY):
    Each module has a lighter same-family HEADBAND strip across the TOP ~35% of
    the block. That entire headband MUST be seamless near-white / very-light-gray
    flat wash (luma ≥ 220, almost no texture, no hatching, no grid lines bleeding
    into the band). PURE BACKGROUND ONLY — zero icons, zero strokes inside the
    band. Treat as blank paper for later vector titles. Place ALL engineering
    illustration ONLY in the denser portion BELOW the headband. Leave ≥2mm gap
    under the headband before art. Panel outer title bands above modules also
    stay plain flat near-white wash. Do NOT invent extra empty rounded cards,
    blank frames, or decorative triangles anywhere (especially not in the bottom
    strip or module corners).

    ICON PLACEMENT: Full nested structure in the denser lower zone only; stacks
    complete and uncropped; ≥2mm from block edges and from the headband.

    Pale-gray reserved blocks (skeleton #EEEEEE) stay plain — do not illustrate
    them (vector solids will cover). Describe modules by POSITION only.

    LEFT cool pale panel (Environment & Agent) — illustrate ONLY these blocks:
    - Top parallelogram block: MUST show nested task-dispatcher stack — thin
      orthogonal rectangles like a schema / control plane (ticket cards as flat
      rect slots, tiny tree as geometric lines). GREYSCALE. Art below headband.
      This block must NOT be empty. NO clipboard cute props.
    - Large center block (STEEL-BLUE critical path): Agent Policy as ABSTRACT
      neural block stack — stacked Transformer/ResNet-like rectangles with light
      hatching and one nested inner block. Muted steel-blue wash OK. Art only
      below headband; headband stays plain light blue-grey. FORBIDDEN: robot
      head, smiley, eyes, cheeks, anthropomorphic chip-brain mascot.
    - Bottom row of three small blocks are pale-gray reserved — leave plain
      (Search / Code / Memory are vector solids).

    UPPER-MIDDLE warm-neutral panel (Trajectory Sampling):
    - Left greyscale block: rollout ARRAY — tight grid / step cells below the
      headband only. FORBIDDEN: parchment scroll, ribbon tips, arrowheads,
      saturated cell colors.
    - Right of that block: calm empty light strip for later vector tokens.

    UPPER-RIGHT pale panel (Advantage & Update):
    - Top greyscale block: comparison BAR MODULE — bars fully below headband,
      never cut by the headband. Greyscale only.
    - Bottom block (STEEL-BLUE critical path): nested residual-style update
      stack below headband; headband plain light blue-grey. Prefer stacked
      blocks over gears; no white triangles, no decorative corner wedges.

    LOWER-MIDDLE mint-neutral panel (Reward Model):
    - Left tall greyscale block: reward scoring head with bars below headband.
      GREYSCALE. FORBIDDEN: balance scale, trophy, medal, baked labels.
    - Three small pale-gray reserved blocks — leave plain.

    LOWER-RIGHT near-white panel (Side Path):
    - Single tall greyscale block: database cylinder / buffer stack + hatched
      frozen reference stack, all below headband. NO ice crystal, NO text.

    BOTTOM strip:
    - Completely plain light wash across the full width — NO boxes, NO rounded
      empty cards, NO frames, NO triangles. Vector equation + legend cover this.

    Style reminder: greyscale except Policy + GRPO/PPO steel-blue; hairline
    strokes; plain empty headbands; illustration only below headbands; no
    arrows; no text; no empty decorative cards.

elements:
  # ---- 面板（ghost；题字带裸文字；rew/aux 显式 plate≤2）----
  - {type: panel, id: p_env, rect: [3.25, 3.07, 46.00, 64.88], title: "Environment & Agent",
     header_style: smallcaps, title_size: 6.0, ghost: true, plate: false}
  - {type: panel, id: p_roll, rect: [53.32, 3.07, 75.51, 38.39], title: "Trajectory Sampling",
     header_style: smallcaps, title_size: 6.0, ghost: true, plate: false}
  - {type: panel, id: p_upd, rect: [132.89, 3.07, 47.86, 38.39], title: "Advantage & Update",
     header_style: smallcaps, title_size: 6.0, ghost: true, plate: false}
  - {type: panel, id: p_rew, rect: [53.32, 41.34, 75.51, 31.61], title: "",
     header_style: smallcaps, title_size: 6.0, ghost: true, plate: false}
  # SIDE PATH：不用 panel.title（贴片会左伸出界）；改用带内可控 text
  - {type: panel, id: p_aux, rect: [132.77, 41.34, 47.97, 31.61], title: "",
     header_style: smallcaps, title_size: 6.0, ghost: true, plate: false}

  # ---- 插画模块 ghost（空标题，仅锚点；文字用 text 落题字带）----
  - {type: box, id: env, rect: [5.34, 9.09, 41.82, 13.82], title: "",
     variant: plain, ghost: true, plate: false}
  - {type: box, id: policy, rect: [5.46, 24.96, 41.70, 24.70], title: "",
     variant: plain, ghost: true, plate: false}
  - {type: box, id: roll, rect: [55.29, 9.09, 33.92, 27.26], title: "",
     variant: plain, ghost: true, plate: false}
  - {type: box, id: adv, rect: [134.98, 9.09, 43.68, 15.23], title: "",
     variant: plain, ghost: true, plate: false}
  - {type: box, id: upd, rect: [134.98, 27.26, 43.56, 12.41], title: "",
     variant: plain, ghost: true, plate: false}
  - {type: box, id: rm, rect: [55.29, 50.17, 20.10, 20.99], title: "",
     variant: plain, ghost: true, plate: false}
  - {type: box, id: side, rect: [134.98, 49.91, 43.68, 23.04], title: "",
     variant: plain, ghost: true, plate: false}

  # ---- 模块标题：钉回本模块题字带 ----
  # 贴片预算 ≤5：t_env / t_pol / t_upd / t_rm / t_side
  # Task Dispatcher：从画布顶缘收回 env 题字带（第 5 块显式贴片）
  - {type: text, id: t_env, text: "Task Dispatcher · schema/tools", size: 5.0, bold: true,
     color: "#1A202C", at: [26.3, 9.85], anchor: middle, plate: true}
  - {type: text, id: t_pol, text: "Agent Policy π_θ · LLM+tools", size: 5.0, bold: true,
     color: "#1A202C", at: [26.3, 25.85], anchor: middle, plate: true}
  - {type: text, id: t_adv, text: "Advantage Â · group-relative", size: 5.2, bold: true,
     color: "#1A202C", at: [156.8, 10.5], anchor: middle, plate: false}
  - {type: text, id: t_upd, text: "GRPO / PPO · Δθ", size: 5.0, bold: true,
     color: "#1A202C", at: [156.8, 27.55], anchor: middle, plate: true}
  - {type: text, id: t_rm, text: "Reward Head · r(τ)", size: 5.0, bold: true,
     color: "#1A202C", at: [65.3, 50.85], anchor: middle, plate: true}
  - {type: text, id: t_side, text: "Replay Buffer · π_ref", size: 5.0, bold: true,
     color: "#1A202C", at: [156.8, 50.55], anchor: middle, plate: true}
  - {type: text, id: t_p_rew, text: "REWARD MODEL", size: 5.6, bold: true, smallcaps: true,
     color: "#4A5568", at: [105.7, 45.85], anchor: middle, plate: false}
  - {type: text, id: t_p_aux, text: "SIDE PATH", size: 5.6, bold: true, smallcaps: true,
     color: "#4A5568", at: [178.5, 46.5], anchor: end, plate: false}

  # ---- 实心卡：压高至文字占比 ≥55%（两行+pad≈8.3 → h=9.2≈58%）；贴 reserved 槽顶 ----
  - {type: box, id: tool_s, rect: [5.34, 52.20, 13.13, 9.20], title: "Search",
     body: "web/RAG", variant: plain, valign: middle, ghost: false,
     plate: false, title_size: 5.6, body_size: 5.4}
  - {type: box, id: tool_c, rect: [19.63, 52.20, 13.13, 9.20], title: "Code",
     body: "sandbox", variant: secondary, valign: middle, ghost: false,
     plate: false, title_size: 5.6, body_size: 5.4}
  - {type: box, id: tool_m, rect: [34.04, 52.20, 13.13, 9.20], title: "Memory",
     body: "KV R/W", variant: muted, valign: middle, ghost: false,
     plate: false, title_size: 5.6, body_size: 5.4}

  - {type: box, id: r_succ, rect: [76.67, 50.55, 24.51, 8.80], title: "Success",
     body: "task hit", variant: plain, valign: middle, ghost: false,
     plate: false, title_size: 5.6, body_size: 5.4}
  - {type: box, id: r_step, rect: [102.34, 50.55, 24.51, 8.80], title: "−λT",
     body: "steps", variant: muted, valign: middle, ghost: false,
     plate: false, title_size: 5.6, body_size: 5.4}
  - {type: box, id: r_fmt, rect: [76.67, 60.55, 50.18, 8.80], title: "Format Check",
     body: "schema / JSON", variant: secondary, valign: middle, ghost: false,
     plate: false, title_size: 5.6, body_size: 5.4}

  # ---- Sampling 右侧空区：token 两行上下居中、标签间距均匀 ----
  # 箭头 y≈11.2 下方净空 y≈13–40；块高≈19 → 起始约 16.5 使上下余白接近
  - {type: text, id: t_roll, text: "G Rollouts · multi-turn tools", size: 5.2, bold: true,
     color: "#1A202C", at: [91.0, 16.2], anchor: start, plate: false}
  - {type: tokens, id: tok_traj, rect: [91.0, 18.2, 35.5, 5.8], n: 7, direction: h,
     variant: primary, gap: 0.4,
     colors: ["#E8EEF4", "#C5D4E3", "#E8EEF4", "#3D6B99", "#E8EEF4", "#C5D4E3", "#E8EEF4"]}
  - {type: text, id: t_tok, text: "tau · tool-call tokens", size: 5.2,
     color: "#3D6B99", at: [91.0, 25.0], anchor: start, plate: false}
  - {type: tokens, id: tok_tool, rect: [91.0, 27.4, 35.5, 5.8], n: 6, direction: h,
     variant: secondary, gap: 0.45,
     colors: ["#F0F0F0", "#D8D8D8", "#E8E8E8", "#B8B8B8", "#E8E8E8", "#F0F0F0"]}
  - {type: text, id: t_g, text: "G∥ · T steps", size: 5.2,
     color: "#4A5568", at: [91.0, 34.4], anchor: start, plate: false}

  # ---- 底栏：通栏白色页脚带（覆盖灰底条）+ 左公式 + 右图例，同中线、等外边距 ----
  - {type: box, id: foot_band, rect: [0.0, 72.6, 184.0, 13.4], title: "",
     variant: plain, ghost: false, plate: false, fill: "#FFFFFF",
     stroke: "none", valign: middle}
  - {type: box, id: loss_box, rect: [4.5, 74.2, 100.0, 10.0], title: "Training objective",
     body: "L = −Â log π_θ − β KL(π_θ ∥ π_ref)  ·  ↑ return · β·KL trust region",
     variant: plain, ghost: false, plate: false, valign: middle, align: left,
     title_size: 5.4, body_size: 5.2, fill: "#FFFFFF", stroke: "none"}
  - {type: legend, id: lg, at: [145.5, 74.9], columns: 2, size: 5.2, style: card,
     fill: "#FFFFFF", frame: false, items: [
       {swatch: line, color: "#2A2E35", label: "main / data"},
       {swatch: dashed, color: "#2F5A85", label: "Δθ feedback"},
       {swatch: dashed, color: "#5A6472", label: "KL / replay"},
       {swatch: box, color: "#3D6B99", label: "critical path"},
     ]}

  # ---- 角标 ----
  - {type: badge, id: b1, at: [7.0, 10.6], text: "1", size: 2.6, color: "#4A5568"}
  - {type: badge, id: b2, at: [7.0, 27.0], text: "2", size: 2.6, color: "#3D6B99"}
  - {type: badge, id: b3, at: [50.5, 31.5], text: "3", size: 2.6, color: "#4A5568"}
  - {type: badge, id: b4, at: [54.0, 51.6], text: "4", size: 2.6, color: "#4A5568"}
  - {type: badge, id: b5, at: [130.5, 11.2], text: "5", size: 2.6, color: "#3D6B99"}
  - {type: marker, id: m_fire1, at: [45.5, 27.2], icon: fire, size: 2.4}
  - {type: marker, id: m_fire2, at: [178.8, 30.2], icon: fire, size: 2.4}
  - {type: marker, id: m_snow, at: [176.5, 52.6], icon: snow, size: 2.2}

  # ---- 正交箭头（端点锚模块/色块边框；能直则直，最多一 L）----
